name: Evidence Collector

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: Maximum keywords to collect in the fallback worker
        required: false
        default: '50'
      google_mode:
        description: Run full Google collection or recover historical metrics only
        type: choice
        options:
          - full
          - metrics-only
        default: full
  schedule:
    - cron: '17 */4 * * *'
    - cron: '41 3 1 * *'

permissions:
  contents: read
  id-token: write

jobs:
  ensure-collector:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    concurrency:
      group: etgen-evidence-collector
      cancel-in-progress: false
    env:
      BACKEND_URL: https://niche-research-api-kqlt.onrender.com
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SCHEDULED_BATCH_SIZE: ${{ inputs.batch_size || '50' }}
      GOOGLE_ADS_PIPELINE_ENABLED: '0'
      ETSY_HTML_SCRAPER_ENABLED: '0'
      ALLOW_LLM_KEYWORD_EXPANSION: '0'
      ALLOW_LLM_SEED_DISCOVERY: '0'
    steps:
      - uses: actions/checkout@v7

      - name: Check backend availability
        id: backend
        run: |
          set -euo pipefail
          if curl -fsS --max-time 20 "$BACKEND_URL/api/health" > health.json; then
            cat health.json
            echo "online=true" >> "$GITHUB_OUTPUT"
          else
            echo "Backend is unavailable; using the scheduled worker fallback."
            echo "online=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Request short-lived GitHub identity
        id: oidc
        if: ${{ steps.backend.outputs.online == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS --max-time 20 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=etgen-evidence-collector")
          token=$(jq -er '.value' <<< "$response")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Validate issued identity scope
        if: ${{ steps.backend.outputs.online == 'true' }}
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          node <<'NODE'
          const claims = JSON.parse(Buffer.from(process.env.GITHUB_OIDC_TOKEN.split('.')[1], 'base64url'))
          const expected = {
            iss: 'https://token.actions.githubusercontent.com',
            aud: 'etgen-evidence-collector',
            repository: 'guzeman88/niche-research-pwa',
            workflow_ref: 'guzeman88/niche-research-pwa/.github/workflows/keepalive.yml@refs/heads/main',
            ref: 'refs/heads/main',
          }
          for (const [name, value] of Object.entries(expected)) {
            if (claims[name] !== value) throw new Error(`Unexpected ${name}: ${claims[name] ?? 'missing'}`)
          }
          if (!['schedule', 'workflow_dispatch'].includes(claims.event_name)) {
            throw new Error(`Unexpected event_name: ${claims.event_name ?? 'missing'}`)
          }
          NODE

      - name: Ensure continuous collector is running
        if: ${{ steps.backend.outputs.online == 'true' }}
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 \
            -X POST "$BACKEND_URL/api/scheduler/start" \
            -H "Authorization: Bearer $GITHUB_OIDC_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"mode":"continuous","batch_size":30}' \
            > scheduler.json
          cat scheduler.json
          node -e "const s=require('./scheduler.json'); if (!s.running || s.paused || s.fatal_error) throw new Error(JSON.stringify(s))"

      - uses: actions/setup-python@v6
        if: ${{ steps.backend.outputs.online != 'true' }}
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install scheduled worker dependencies
        if: ${{ steps.backend.outputs.online != 'true' }}
        run: python -m pip install -r backend/requirements.txt

      - name: Run quota-aware evidence batch
        if: ${{ steps.backend.outputs.online != 'true' }}
        run: python backend/scripts/run_evidence_batch.py --batch-size "$SCHEDULED_BATCH_SIZE"

  google-keyword-validation:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '41 3 1 * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 210
    concurrency:
      group: etgen-google-keyword-validation
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GOOGLE_ADS_API_VERSION: v25
      GOOGLE_ADS_GEO_TARGET_IDS: '2840'
      GOOGLE_ADS_PIPELINE_ENABLED: '1'
      REQUIRE_SUPABASE: '1'
      GOOGLE_ADS_HISTORICAL_BATCH_SIZE: '2000'
      GOOGLE_VALIDATION_MODE: ${{ inputs.google_mode || 'full' }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify required Google Ads configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER"
          test -n "$GOOGLE_ADS_CUSTOMER_ID"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Verify durable evidence database is available
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 --retry 5 --retry-delay 10 --retry-all-errors \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/keyword_seeds?select=keyword&limit=1" > /dev/null

      - name: Authenticate to Google Cloud without a stored key
        uses: google-github-actions/auth@v3
        with:
          project_id: etgen-keyword-data
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: etgen-keyword-collector@etgen-keyword-data.iam.gserviceaccount.com

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install keyword validation dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Collect and publish monthly keyword evidence
        shell: bash
        run: |
          if [ "$GOOGLE_VALIDATION_MODE" = "metrics-only" ]; then
            python backend/scripts/run_keyword_validation.py --force --no-expand
          else
            python backend/scripts/run_keyword_validation.py --force
          fi

      - name: Preserve local evidence database
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sqlite3

          source = Path('backend/workspace/_keyword_db/keywords.sqlite')
          if source.exists():
              destination = source.with_name('keywords-recovery.sqlite')
              with sqlite3.connect(source) as current, sqlite3.connect(destination) as snapshot:
                  current.backup(snapshot)
              print(f'Preserved {destination} ({destination.stat().st_size:,} bytes)')
          else:
              print('No collector database was created')
          PY

      - name: Upload recoverable evidence database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-evidence-sqlite-${{ github.run_id }}
          path: backend/workspace/_keyword_db/keywords-recovery.sqlite
          retention-days: 7
          if-no-files-found: warn
