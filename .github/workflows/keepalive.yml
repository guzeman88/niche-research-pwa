name: Evidence Collector Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  ensure-collector:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: etgen-evidence-collector
      cancel-in-progress: false
    env:
      BACKEND_URL: https://niche-research-api-kqlt.onrender.com
      PIPELINE_API_TOKEN: ${{ secrets.PIPELINE_API_TOKEN }}
    steps:
      - name: Require operator credential
        run: test -n "$PIPELINE_API_TOKEN"

      - name: Wake backend
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl -fsS --max-time 20 "$BACKEND_URL/api/health" > health.json; then
              cat health.json
              exit 0
            fi
            sleep 10
          done
          echo "Backend did not become healthy within three minutes."
          exit 1

      - name: Ensure continuous collector is running
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 \
            -X POST "$BACKEND_URL/api/scheduler/start" \
            -H "Authorization: Bearer $PIPELINE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"mode":"continuous","batch_size":5}' \
            > scheduler.json
          cat scheduler.json
          node -e "const s=require('./scheduler.json'); if (!s.running || s.paused || s.fatal_error) throw new Error(JSON.stringify(s))"
