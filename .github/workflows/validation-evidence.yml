name: Google Validation Evidence
run-name: Google Validation Evidence ${{ inputs.request_id || 'manual' }}
on:
  workflow_dispatch:
    inputs:
      keywords:
        description: Up to 50 comma-separated buyer keywords from validation or the research shortlist
        required: true
        type: string
      request_id:
        description: Optional unique local orchestrator request identity
        required: false
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: google-validation-evidence
      cancel-in-progress: false
    env:
      GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
      GOOGLE_ADS_API_VERSION: v25
      GOOGLE_ADS_GEO_TARGET_IDS: '2840'
      VALIDATION_KEYWORDS: ${{ inputs.keywords }}
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate with the existing keyless Google identity
        uses: google-github-actions/auth@v3
        with:
          project_id: etgen-keyword-data
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: etgen-keyword-collector@etgen-keyword-data.iam.gserviceaccount.com
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.txt -c backend/requirements-constraints.txt
      - name: Collect focused demand evidence
        run: python backend/scripts/collect_validation_google.py --keywords "$VALIDATION_KEYWORDS" --output work/validation-google.json
      - name: Preserve the evidence package
        uses: actions/upload-artifact@v4
        with:
          name: validation-google-${{ github.run_id }}
          path: work/validation-google.json
          retention-days: 90
          if-no-files-found: error
