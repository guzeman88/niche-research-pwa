name: Validate backend and web app
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -c backend/requirements-constraints.txt -r backend/requirements.txt pytest
      - run: python -m pytest tests -q
        working-directory: backend
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Build committed bundled snapshots
        env:
          SNAPSHOT_SOURCE: bundled
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
