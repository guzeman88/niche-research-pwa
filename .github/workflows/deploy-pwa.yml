name: Refresh PWA Data And Deploy

on:
  workflow_dispatch:
    inputs:
      reuse_verified_snapshot:
        description: 'Incident recovery only: keep all eight snapshots from a pinned prior deployment'
        type: boolean
        default: false
      snapshot_url:
        description: 'Immutable https://<deploy-id>--etgen.netlify.app URL, required for recovery'
        type: string
      snapshot_commit:
        description: 'Exact 40-character source commit of that deployment'
        type: string
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: production-web-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_BACKUP_API_URLS: ${{ vars.VITE_BACKUP_API_URLS }}
      VITE_WAKE_BACKEND: ${{ vars.VITE_WAKE_BACKEND }}
      SNAPSHOT_SOURCE: ${{ inputs.reuse_verified_snapshot && 'released' || 'private-export' }}
      RELEASED_SNAPSHOT_URL: ${{ inputs.snapshot_url || 'https://6b05ffc073d65847f7501f00--etgen.netlify.app' }}
      RELEASED_SNAPSHOT_COMMIT: ${{ inputs.snapshot_commit || 'c329b50b209aa69cca22a461204adbd1fa605ce6' }}
      MIN_KEYWORD_SNAPSHOT_COUNT: '13000'
      MIN_GOOGLE_VOLUME_COUNT: '30000'
      NETLIFY_SITE_ID: 9c00efca-ced9-4097-b302-172437380b32
    steps:
      - uses: actions/checkout@v7

      - name: Require production credentials
        env:
          ACCOUNT_SUPABASE_URL: ${{ secrets.ACCOUNT_SUPABASE_URL }}
          ACCOUNT_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ACCOUNT_SUPABASE_SERVICE_ROLE_KEY }}
          DASHBOARD_BRIDGE_SECRET: ${{ secrets.DASHBOARD_BRIDGE_SECRET }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN"
          if [ "$SNAPSHOT_SOURCE" = "private-export" ]; then
            test -n "$ACCOUNT_SUPABASE_URL"
            test -n "$ACCOUNT_SUPABASE_SERVICE_ROLE_KEY"
            test -n "$DASHBOARD_BRIDGE_SECRET"
          fi

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -c backend/requirements-constraints.txt -r backend/requirements.txt
      - run: python scripts/install-production-engine.py
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          ACCOUNT_SUPABASE_URL: ${{ secrets.ACCOUNT_SUPABASE_URL }}
          ACCOUNT_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ACCOUNT_SUPABASE_SERVICE_ROLE_KEY }}
          DASHBOARD_BRIDGE_SECRET: ${{ secrets.DASHBOARD_BRIDGE_SECRET }}
      - run: npm run smoke
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: npx --yes netlify-cli deploy --prod --dir=dist --no-build --site="$NETLIFY_SITE_ID"

      - name: Verify live snapshot
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/verify-release.cjs https://etgen.xyz; then
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "Production still differs after six checks" >&2
              exit 1
            fi
            echo "Waiting for the production domain to serve the new deploy (attempt $attempt/6)"
            sleep 5
          done
