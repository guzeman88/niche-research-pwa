name: Refresh PWA Data And Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: production-web-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_BACKUP_API_URLS: ${{ vars.VITE_BACKUP_API_URLS }}
      VITE_WAKE_BACKEND: ${{ vars.VITE_WAKE_BACKEND }}
      REQUIRE_SUPABASE: '1'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MIN_KEYWORD_SNAPSHOT_COUNT: '13000'
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: 9c00efca-ced9-4097-b302-172437380b32
    steps:
      - uses: actions/checkout@v7

      - name: Require production credentials
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$NETLIFY_AUTH_TOKEN"

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run smoke

      - name: Deploy to Netlify
        run: npx --yes netlify-cli deploy --prod --dir=dist --no-build --site="$NETLIFY_SITE_ID"

      - name: Verify live snapshot
        run: node scripts/verify-release.cjs https://etsy-niches.netlify.app
