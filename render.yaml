# Render Blueprint — deploys the Python FastAPI backend
# Free tier: render.com → New → Blueprint → point to this repo
services:
  - type: web
    name: niche-research-api
    env: python
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: BACKEND_DIR
        value: /opt/render/project/src/backend
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AUTO_START_SCHEDULER
        value: 1
      - key: SCHEDULER_MODE
        value: continuous
      - key: SCHEDULER_BATCH_SIZE
        value: 30
      - key: ETSY_DAILY_QUOTA_TARGET_PCT
        value: 80
      - key: COLLECTION_TARGET_BATCH_SIZE
        value: 30
      - key: ETSY_ACTIVE_BURST_INTERVAL_SECONDS
        value: 1
      - key: ETSY_QUOTA_RECHECK_SECONDS
        value: 600
      - key: SCHEDULER_RESEARCH_ADAPTERS
        value: etsy_open_api,google_suggest,google_trends,pinterest_trends,reddit_etsy
      - key: SCHEDULER_INCLUDE_SEASONALITY
        value: 0
      - key: SCHEDULER_ALLOW_LLM_SYNTHESIS
        value: 0
      - key: GOOGLE_DAILY_TRENDS_GEO
        value: US
      - key: GOOGLE_DAILY_TRENDS_CACHE_SECONDS
        value: 3600
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      - key: GOOGLE_ADS_CLIENT_ID
        sync: false
      - key: GOOGLE_ADS_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ADS_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_ADS_CUSTOMER_ID
        sync: false
      - key: GOOGLE_ADS_LOGIN_CUSTOMER_ID
        sync: false
      - key: GOOGLE_ADS_API_VERSION
        value: v25
      - key: GOOGLE_ADS_GEO_TARGET_IDS
        value: 2840
      - key: GOOGLE_ADS_PIPELINE_ENABLED
        value: 1
      - key: GOOGLE_ADS_PIPELINE_CHECK_SECONDS
        value: 21600
      - key: GOOGLE_ADS_IDEA_REFRESH_DAYS
        value: 30
      - key: GOOGLE_ADS_METRIC_REFRESH_DAYS
        value: 30
      - key: GOOGLE_ADS_SEED_LIMIT
        value: 500
      - key: GOOGLE_ADS_MAX_NEW_KEYWORDS
        value: 50000
      - key: GOOGLE_ADS_IDEAS_PER_REQUEST
        value: 2000
      - key: GOOGLE_ADS_KEYWORD_CYCLE_LIMIT
        value: 50000
      - key: GOOGLE_ADS_HISTORICAL_BATCH_SIZE
        value: 10000
      - key: GITHUB_HEARTBEAT_AUDIENCE
        value: etgen-evidence-collector
      - key: GITHUB_HEARTBEAT_REPOSITORY
        value: guzeman88/niche-research-pwa
      - key: GITHUB_HEARTBEAT_WORKFLOW_REF
        value: guzeman88/niche-research-pwa/.github/workflows/keepalive.yml@refs/heads/main
      - key: GITHUB_DEPLOY_WORKFLOW_REF
        value: guzeman88/niche-research-pwa/.github/workflows/deploy-backend.yml@refs/heads/main
